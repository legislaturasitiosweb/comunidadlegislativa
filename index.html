<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunidad Legislativa</title>

  <!-- === ETIQUETAS OPEN GRAPH PARA WHATSAPP Y REDES SOCIALES === -->
  <meta property="og:title" content="Comunidad Legislativa - Red Social Interna">
  <meta property="og:description" content="Espacio digital de conexión e interacción institucional de la Función Legislativa.">
  <meta property="og:image" content="https://i.postimg.cc/bJ45dMVW/COMUNIDADLEGISLATIVAREDSOCIALLOGO.jpg">
  <meta property="og:url" content="https://legislaturasitiosweb.github.io/comunidadlegislativa/"> 
  <meta property="og:type" content="website">

  <!-- Twitter Card (Opcional, para que también funcione bien en Twitter/X) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Comunidad Legislativa">
  <meta name="twitter:description" content="Red Social Interna del Personal Legislativo.">
  <meta name="twitter:image" content="https://i.postimg.cc/DzZgbrSX/LOGO-LEGISLATURA-2.png">

  <!-- Tailwind CSS CDN para estilos rápidos -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Estilos personalizados para asegurar pantalla completa sin barras de scroll innecesarias */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 relative">

  <!-- Pantalla de Carga (Overlay) -->
  <div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-900 text-white transition-opacity duration-500">
    <div class="flex flex-col items-center gap-4">
      <!-- Spinner Animado -->
      <div class="w-12 h-12 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
      
      <!-- Texto de carga -->
      <div class="text-center">
        <h2 class="text-lg font-bold tracking-wide">Comunidad Legislativa</h2>
        <p class="text-xs text-slate-400 mt-1 animate-pulse">Cargando datos...</p>
      </div>
    </div>
  </div>

  <!-- Contenedor del Iframe -->
  <iframe 
    id="webapp-iframe"
    src="https://script.google.com/macros/s/AKfycby5JdFpllx5JTQ5lYHFbZvqPYoWWewIfTfzsNXe0QG3B2VAZEtl7fAP-N8L2Zi3XA/exec" 
    class="w-full h-full border-0"
    allow="geolocation; microphone; camera; clipboard-write; encrypted-media"
    onload="ocultarLoader()">
  </iframe>

  <script>
    function ocultarLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        // Transición de salida suave
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.display = 'none';
        }, 500);
      }
    }
  </script>
</body>
</html>
